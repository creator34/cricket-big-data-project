name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-pyspark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bronze
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python 1_APIIngestionAndBronzeLayer.py

      - name: Run Silver
        run: python 2_BronzetoSilverCleanMatchTable.py

      - name: Run Gold
        run: python 3_GoldLayerAnalyticsPrep.py